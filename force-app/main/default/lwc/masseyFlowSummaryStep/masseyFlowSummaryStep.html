<template>
  <div class="flow-summary-step">
    <template lwc:if={isLoading}>
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading summary...</div>
      </div>
    </template>

    <template lwc:if={isReady}>
      <div class="completion-banner">
        <div class="completion-icon">&#x2705;</div>
        <div class="completion-title">Service Visit Summary</div>
        <div class="completion-subtitle">Review all data before completing</div>
      </div>

      <!-- Service Visit Details -->
      <div class="summary-card">
        <div class="card-header">
          <span class="card-icon">&#x1F4CB;</span>
          <span class="card-title">Service Visit Details</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Work Order</span>
          <span class="summary-value">{workOrderNumber}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Property</span>
          <span class="summary-value">{assetName}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Service Line</span>
          <span class="summary-value">{serviceLine}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Duration</span>
          <span class="summary-value">{duration}</span>
        </div>
      </div>

      <!-- Safety Gate -->
      <div class="summary-card">
        <div class="card-header">
          <span class="card-icon">&#x1F6E1;&#xFE0F;</span>
          <span class="card-title">Safety Gate</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Status</span>
          <span class={safetyBadgeClass}>{safetyGateStatus}</span>
        </div>
        <template lwc:if={safetyGatePassedAt}>
          <div class="summary-row">
            <span class="summary-label">Cleared At</span>
            <span class="summary-value">{safetyGatePassedAt}</span>
          </div>
        </template>
      </div>

      <!-- Service Impact (cluster events) -->
      <div class="summary-card">
        <div class="card-header">
          <span class="card-icon">&#x26A1;</span>
          <span class="card-title">Service Impact &amp; Cluster Events</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Pest Finding</span>
          <span class="summary-value">{pestFinding}</span>
        </div>
        <template lwc:if={hasLinkedIncident}>
          <div class="summary-row">
            <span class="summary-label">Linked Cluster</span>
            <span class="summary-value">{incidentNumber}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Priority</span>
            <span class="summary-value">{incidentPriority}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Cluster Status</span>
            <span class="summary-value">{incidentStatus}</span>
          </div>
        </template>
        <template lwc:else>
          <div class="summary-row">
            <span class="summary-label">Linked Cluster</span>
            <span class="summary-value muted">None</span>
          </div>
        </template>
      </div>

      <!-- Documentation Logged — pest visit recordkeeping (3 checks).
           Replaces the legacy Treatment Report Package card. The actual
           regulatory paperwork for a quarterly pest visit is just: EPA
           Reg # logged, applicator license logged, and customer sign-off
           captured. No multi-page packet, no "generate" step. -->
      <div class="summary-card doclog-card">
        <div class="card-header">
          <span class="card-icon">&#x1F4CB;</span>
          <span class="card-title">{labels.docLogHeading}</span>
          <template lwc:if={docLogAllGreen}>
            <span class="doclog-pill doclog-pill-green">&#x2713;</span>
          </template>
          <template lwc:else>
            <span class="doclog-pill doclog-pill-amber">&#x21;</span>
          </template>
        </div>
        <div class="doclog-rows">
          <div class="doclog-row">
            <span class={epaRowIconClass}>{epaRowIcon}</span>
            <span class="doclog-row-text">{epaRowText}</span>
          </div>
          <div class="doclog-row">
            <span class={licenseRowIconClass}>{licenseRowIcon}</span>
            <span class="doclog-row-text">{licenseRowText}</span>
          </div>
          <div class="doclog-row">
            <span class={signoffRowIconClass}>{signoffRowIcon}</span>
            <span class="doclog-row-text">{signoffRowText}</span>
          </div>
        </div>
      </div>

      <!-- AI Visit Quality Score -->
      <c-ai-insight-card
        title={visitQualityTitle}
        summary={visitQualitySummary}
        severity={visitQualitySeverity}
        confidence={visitQualityConfidence}
        source={visitQualitySource}
        timestamp={insightTimestamp}
        details={visitQualityDetails}
      ></c-ai-insight-card>

      <!-- AI Property Pressure Impact card removed per PM review #6.
           Signal already surfaced on the Site step / upsell card; on the
           Summary surface it competed with the Visit Quality card. One AI
           card on close-out. -->

      <!-- Upsell coach OR recap card.
           If Maria already captured an outcome in Site step, show a small
           recap card instead of re-rendering the full pitch UI (don't
           re-prompt at close-out — she already did the work). -->
      <template lwc:if={upsellAlreadyCaptured}>
        <div class="summary-card upsell-recap-card">
          <div class="card-header">
            <span class={upsellRecapIconClass}>{upsellRecapIcon}</span>
            <span class="card-title">Upsell Pitch</span>
          </div>
          <p class="upsell-recap-text">{upsellRecapText}</p>
        </div>
      </template>
      <template lwc:if={showFullUpsellCoach}>
        <template lwc:if={effectiveAccountId}>
          <c-massey-upsell-coach
            account-id={effectiveAccountId}
            variant="full"
            onoutcomecaptured={handleUpsellOutcome}
          ></c-massey-upsell-coach>
        </template>
      </template>

      <!-- Sign-Off card — last action before Complete. Two paths:
           customer-here -> signature pad; customer-not-home -> photo of
           door hanger. Both produce a ContentVersion linked to the WO. -->
      <div class="summary-card signoff-card">
        <div class="card-header">
          <span class="card-icon">&#x270D;&#xFE0F;</span>
          <span class="card-title">{labels.heading}</span>
          <template lwc:if={signOffComplete}>
            <span class="signoff-pill">
              <template lwc:if={signatureCaptured}>&#x2713; {labels.signed}</template>
              <template lwc:if={hangerCaptured}>&#x2713; {labels.hangerLogged}</template>
            </span>
          </template>
        </div>

        <!-- Path chooser -->
        <template lwc:if={showPathChooser}>
          <div class="signoff-choices">
            <button
              type="button"
              class="signoff-choice signoff-choice-home"
              data-path="home"
              onclick={handleChoosePath}
            >
              <span class="signoff-choice-icon">&#x1F464;</span>
              <span class="signoff-choice-label">{labels.chooseHome}</span>
            </button>
            <button
              type="button"
              class="signoff-choice signoff-choice-nothome"
              data-path="nothome"
              onclick={handleChoosePath}
            >
              <span class="signoff-choice-icon">&#x1F6AA;</span>
              <span class="signoff-choice-label">{labels.chooseNotHome}</span>
            </button>
          </div>
        </template>

        <!-- Customer here: signature pad -->
        <template lwc:if={showHomePath}>
          <div class="signoff-sign-heading">{labels.signHeading}</div>
          <div class="signature-pad-wrap">
            <canvas
              class="signature-canvas"
              onmousedown={handleSignatureStart}
              onmousemove={handleSignatureMove}
              onmouseup={handleSignatureEnd}
              onmouseleave={handleSignatureEnd}
              ontouchstart={handleSignatureStart}
              ontouchmove={handleSignatureMove}
              ontouchend={handleSignatureEnd}
              ontouchcancel={handleSignatureEnd}
            ></canvas>
          </div>
          <div class="signoff-actions">
            <button type="button" class="signoff-secondary" onclick={handleClearSignature}>
              {labels.signClear}
            </button>
            <button
              type="button"
              class="signoff-primary"
              onclick={handleSaveSignature}
              disabled={saveSignatureDisabled}
            >
              {labels.signSave}
            </button>
          </div>
        </template>

        <!-- Customer not home: door hanger photo -->
        <template lwc:if={showNotHomePath}>
          <input
            type="file"
            accept="image/*"
            class="file-input-hidden hanger-input"
            onchange={handleHangerFileSelected}
          />
          <button
            type="button"
            class="signoff-primary signoff-hanger-cta"
            onclick={handleHangerCaptureClick}
            disabled={signOffSaving}
          >
            <span class="btn-icon">&#x1F4F7;</span> {labels.hangerCta}
          </button>
        </template>

        <!-- Confirmation: signature thumbnail / hanger thumbnail -->
        <template lwc:if={showSignedPill}>
          <div class="signoff-confirm">&#x2713; {labels.signed} {signatureSavedAt}</div>
          <template lwc:if={signOffOffline}>
            <div class="signoff-offline">&#x2713; Saved offline — will sync</div>
          </template>
        </template>
        <template lwc:if={showHangerPill}>
          <template lwc:if={hangerThumbDataUrl}>
            <img src={hangerThumbDataUrl} alt="Door hanger" class="hanger-thumb" />
          </template>
          <div class="signoff-confirm">&#x2713; {labels.hangerLogged} {hangerSavedAt}</div>
          <template lwc:if={signOffOffline}>
            <div class="signoff-offline">&#x2713; Saved offline — will sync</div>
          </template>
        </template>

        <!-- Reset: switch between paths if tech tapped wrong -->
        <template lwc:if={canShowChangeLink}>
          <button type="button" class="signoff-change-link" onclick={handleResetPath}>
            {labels.change}
          </button>
        </template>
      </div>

      <button
        class={completeButtonClass}
        onclick={handleCompleteWorkOrder}
        disabled={completeDisabled}
      >
        {completeButtonLabel}
      </button>

      <!-- Next-stop handoff modal — fires after Complete succeeds. Gives the
           tech a momentum signal ("here's where you go next") instead of a
           dead-end success dialog. -->
      <template lwc:if={showNextStopHandoff}>
        <div class="next-stop-backdrop" onclick={handleCloseNextStopHandoff}></div>
        <div class="next-stop-modal" role="dialog" aria-labelledby="next-stop-heading">
          <div class="next-stop-check">✓</div>
          <h3 id="next-stop-heading" class="next-stop-heading">Service visit complete</h3>
          <p class="next-stop-sub">Lead captured. Jordan will follow up to close the sale.</p>
          <div class="next-stop-card">
            <span class="next-stop-card-label">Up next</span>
            <p class="next-stop-time">{nextStopTime}</p>
            <p class="next-stop-name">{nextStopName}</p>
            <p class="next-stop-address">{nextStopAddress}</p>
            <p class="next-stop-distance">{nextStopDistance}</p>
          </div>
          <div class="next-stop-actions">
            <button class="next-stop-btn-primary" onclick={handleStartNextStop}>
              Start next stop
            </button>
          </div>
        </div>
      </template>
    </template>

    <template lwc:if={error}>
      <div class="error-banner">
        <span class="error-icon">&#x26A0;&#xFE0F;</span>
        <span class="error-text">{error}</span>
      </div>
    </template>
  </div>
</template>
