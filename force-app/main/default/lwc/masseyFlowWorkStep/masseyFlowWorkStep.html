<template>
    <!-- Restricted-Use Pesticide attestation panel — runs alongside Pre-Treatment Setup.
         The chemical panel is the gate — work cannot proceed without RUP attestation. -->
    <c-massey-flow-chemical-panel record-id={recordId}></c-massey-flow-chemical-panel>

    <!-- AI Next Best Actions for the active phase -->
    <template lwc:if={hasNbaSuggestions}>
        <div class="nba-strip">
            <div class="nba-strip-label">
                Suggested Actions &mdash; {activeNbaCategoryLabel}
            </div>
            <div class="nba-strip-cards">
                <template for:each={nbaSuggestions} for:item="nba">
                    <c-ai-insight-card
                        key={nba.key}
                        title={nba.title}
                        summary={nba.summary}
                        severity={nba.severity}
                        confidence={nba.confidence}
                        source={nba.source}
                        timestamp={nbaTimestamp}
                        details={nba.details}
                    ></c-ai-insight-card>
                </template>
            </div>
        </div>
    </template>

    <!-- Phase 1: Pre-Treatment Setup -->
    <div class="phase-card phase-precheck">
        <div class="phase-title">🟠 {phase1Title}</div>
        <div class="phase-progress">
            {preCheckCount} of {preCheckTotal} complete
        </div>

        <template lwc:if={preCheckTotal}>
            <div class="checklist-container">
                <template for:each={preCheckSteps} for:item="step">
                    <div key={step.id} class="checklist-item">
                        <template lwc:if={step.isNA}>
                            <button class="na-badge-btn" data-id={step.id} onclick={handleUndoNA}>N/A</button>
                        </template>
                        <template lwc:else>
                            <lightning-input
                                type="toggle"
                                data-id={step.id}
                                checked={step.isChecked}
                                onchange={handleCheckToggle}
                            ></lightning-input>
                        </template>
                        <div class={step.textClass}>{step.name}</div>
                        <template lwc:if={step.showSkipBtn}>
                            <button class="skip-btn" data-id={step.id} onclick={handleMarkNA}>Skip</button>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- Phase 2: Treatment Execution -->
    <div class="phase-card phase-execute">
        <div class="phase-title">🟢 {phase2Title}</div>
        <div class="phase-progress">
            {workExecuteCount} of {workExecuteTotal} complete
        </div>

        <template lwc:if={isWorkExecuteLocked}>
            <div class="phase-locked-overlay">
                <div class="lock-icon">🔒</div>
                <div class="lock-text">{phase1LockMessage}</div>
            </div>
        </template>

        <template lwc:if={workExecuteTotal}>
            <div class="checklist-container">
                <template for:each={workExecuteSteps} for:item="step">
                    <div key={step.id} class="checklist-item">
                        <template lwc:if={step.isNA}>
                            <button class="na-badge-btn" data-id={step.id} onclick={handleUndoNA}>N/A</button>
                        </template>
                        <template lwc:else>
                            <lightning-input
                                type="toggle"
                                data-id={step.id}
                                checked={step.isChecked}
                                onchange={handleCheckToggle}
                                disabled={isWorkExecuteLocked}
                            ></lightning-input>
                        </template>
                        <div class={step.textClass}>{step.name}</div>
                        <template lwc:if={step.showSkipBtn}>
                            <button class="skip-btn" data-id={step.id} onclick={handleMarkNA}>Skip</button>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- Findings & Observations — variant-aware Walk-Around capture.
         Lives at the end of Treatment Execution (relocated from the Site step)
         since the tech is recording what was found during the visit. -->
    <div class="phase-card phase-findings">
        <div class="phase-title">📋 {label.findingsHeading}</div>
        <p class="reading-prompt">{label.readingPrompt}</p>

        <!-- Pest Finding picker — Pest_Finding__c categorical capture.
             Persists on change (no separate save) per the picker handler. -->
        <div class="findings-grid">
            <div class="findings-item">
                <label for="pest-finding" class="input-label">{label.pestFinding}</label>
                <select id="pest-finding" class="text-input" onchange={handlePestFindingChange}>
                    <template for:each={pestFindingOptions} for:item="opt">
                        <option key={opt.value} value={opt.value} selected={opt.selected}>
                            {opt.label}
                        </option>
                    </template>
                </select>
            </div>
        </div>

        <!-- Pest (residential GoGreen): pressure score, conducive conditions, perimeter -->
        <template lwc:if={isPest}>
            <div class="findings-grid">
                <div class="findings-item">
                    <label for="pest-pressure" class="input-label">Pest Pressure Score (0-100)</label>
                    <input id="pest-pressure" type="number" min="0" max="100" step="1"
                           class="text-input" placeholder="35" onchange={handlePestPressureChange} />
                </div>
                <div class="findings-item">
                    <label for="conducive" class="input-label">Conducive Conditions Observed</label>
                    <input id="conducive" type="text" class="text-input"
                           placeholder="e.g. wood-to-soil contact, mulch against foundation"
                           onchange={handleConduciveChange} />
                </div>
                <div class="findings-item">
                    <label for="perimeter" class="input-label">Treatment Perimeter (linear ft)</label>
                    <input id="perimeter" type="number" min="0" step="1"
                           class="text-input" placeholder="180" onchange={handlePerimeterChange} />
                </div>
            </div>
        </template>

        <!-- Termite: active bait stations + soil treatment depth -->
        <template lwc:if={isTermite}>
            <div class="findings-grid">
                <div class="findings-item">
                    <label for="bait-active" class="input-label">Active Bait Stations</label>
                    <input id="bait-active" type="number" min="0" step="1"
                           class="text-input" placeholder="4" onchange={handleBaitStationsChange} />
                </div>
                <div class="findings-item">
                    <label for="soil-depth" class="input-label">Soil Treatment Depth (in)</label>
                    <input id="soil-depth" type="number" min="0" step="0.5"
                           class="text-input" placeholder="6.0" onchange={handleSoilDepthChange} />
                </div>
            </div>
        </template>

        <!-- Mosquito Hunter: standing water + nozzles -->
        <template lwc:if={isMosquito}>
            <div class="findings-grid">
                <div class="findings-item">
                    <label for="standing-water" class="input-label">Standing Water Sources</label>
                    <input id="standing-water" type="number" min="0" step="1"
                           class="text-input" placeholder="2" onchange={handleStandingWaterChange} />
                </div>
                <div class="findings-item">
                    <label for="nozzles" class="input-label">Nozzles Inspected</label>
                    <input id="nozzles" type="number" min="0" step="1"
                           class="text-input" placeholder="22" onchange={handleNozzlesChange} />
                </div>
            </div>
        </template>

        <!-- Lawn Service: soil temperature + weed coverage -->
        <template lwc:if={isLawn}>
            <div class="findings-grid">
                <div class="findings-item">
                    <label for="soil-temp" class="input-label">Soil Temperature (°F)</label>
                    <input id="soil-temp" type="number" step="0.1"
                           class="text-input" placeholder="68.0" onchange={handleSoilTempChange} />
                </div>
                <div class="findings-item">
                    <label for="weed-coverage" class="input-label">Weed Coverage (%)</label>
                    <input id="weed-coverage" type="number" min="0" max="100" step="1"
                           class="text-input" placeholder="12" onchange={handleWeedCoverageChange} />
                </div>
            </div>
        </template>

        <button class="findings-save-btn" onclick={handleSaveFindings} disabled={isSavingFindings}>
            {saveFindingsLabel}
        </button>
    </div>

    <!-- Phase 3: Post-Treatment Verification -->
    <div class="phase-card phase-verify">
        <div class="phase-title">🔵 {phase3Title}</div>
        <div class="phase-progress">
            {verifyCount} of {verifyTotal} complete
        </div>

        <template lwc:if={isVerifyLocked}>
            <div class="phase-locked-overlay">
                <div class="lock-icon">🔒</div>
                <div class="lock-text">{phase2LockMessage}</div>
            </div>
        </template>

        <template lwc:if={verifyTotal}>
            <div class="checklist-container">
                <template for:each={verifySteps} for:item="step">
                    <div key={step.id} class="checklist-item">
                        <template lwc:if={step.isNA}>
                            <button class="na-badge-btn" data-id={step.id} onclick={handleUndoNA}>N/A</button>
                        </template>
                        <template lwc:else>
                            <lightning-input
                                type="toggle"
                                data-id={step.id}
                                checked={step.isChecked}
                                onchange={handleCheckToggle}
                                disabled={isVerifyLocked}
                            ></lightning-input>
                        </template>
                        <div class={step.textClass}>{step.name}</div>
                        <template lwc:if={step.showSkipBtn}>
                            <button class="skip-btn" data-id={step.id} onclick={handleMarkNA}>Skip</button>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
