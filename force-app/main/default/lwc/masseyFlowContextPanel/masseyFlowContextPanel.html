<template>
  <div class={backdropClasses} onclick={handleBackdropClick}></div>

  <div class={panelClasses} onclick={handlePanelClick}>
    <div class="handle-bar-container">
      <div class="handle-bar"></div>
    </div>

    <button class="close-btn" onclick={handleCloseButtonClick} aria-label="Close panel">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>

    <div class="panel-content">
      <!-- Route Context — only renders when WO has Route__c / Branch__c context -->
      <template lwc:if={hasRouteContext}>
        <div class="section">
          <h2 class="section-title">Route Context</h2>
          <div class="details-container">
            <template lwc:if={routeName}>
              <div class="detail-row">
                <span class="detail-label">Route</span>
                <span class="detail-value">{routeName}</span>
              </div>
            </template>
            <template lwc:if={branchName}>
              <div class="detail-row">
                <span class="detail-label">Branch</span>
                <span class="detail-value">{branchName}</span>
              </div>
            </template>
            <template lwc:if={quarterlyCadence}>
              <div class="detail-row">
                <span class="detail-label">Cadence</span>
                <span class="detail-value">{quarterlyCadence}</span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Property / Asset Details Section -->
      <div class="section">
        <h2 class="section-title">Property Details</h2>

        <template lwc:if={isLoadingAsset}>
          <div class="loading-message">Loading property information...</div>
        </template>

        <template lwc:elseif={assetData.name}>
          <div class="details-container">
            <div class="detail-row">
              <span class="detail-label">Name</span>
              <span class="detail-value">{assetData.name}</span>
            </div>

            <template lwc:if={assetData.serviceLine}>
              <div class="detail-row">
                <span class="detail-label">Service Line</span>
                <span class="detail-value">{assetData.serviceLine}</span>
              </div>
            </template>

            <template lwc:if={assetData.serialNumber}>
              <div class="detail-row">
                <span class="detail-label">Serial Number</span>
                <span class="detail-value">{assetData.serialNumber}</span>
              </div>
            </template>

            <template lwc:if={assetData.status}>
              <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class={statusBadgeClass}>{assetData.status}</span>
              </div>
            </template>

            <template lwc:if={assetData.installDate}>
              <div class="detail-row">
                <span class="detail-label">First Service Date</span>
                <span class="detail-value">{formattedInstallDate}</span>
              </div>
            </template>

            <template lwc:if={assetData.route}>
              <div class="detail-row">
                <span class="detail-label">Route</span>
                <span class="detail-value">{assetData.route}</span>
              </div>
            </template>

            <template lwc:if={assetData.branch}>
              <div class="detail-row">
                <span class="detail-label">Branch</span>
                <span class="detail-value">{assetData.branch}</span>
              </div>
            </template>

            <template lwc:if={assetData.latitude}>
              <div class="detail-row">
                <span class="detail-label">Coordinates</span>
                <span class="detail-value">{assetData.latitude}, {assetData.longitude}</span>
              </div>
            </template>

            <template lwc:if={hasNfcTag}>
              <div class="detail-row">
                <span class="detail-label">NFC Tag ID</span>
                <span class="detail-value">{assetData.nfcTagId}</span>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Recent Service Visits -->
      <div class="section">
        <h2 class="section-title">Recent Service Visits</h2>

        <template lwc:if={isLoadingWorkOrders}>
          <div class="loading-message">Loading service visit history...</div>
        </template>

        <template lwc:elseif={hasWorkOrders}>
          <div class="work-order-list">
            <template for:each={workOrders} for:item="wo">
              <div class="work-order-card" key={wo.id}>
                <div class="wo-header">
                  <span class="wo-number">{wo.workOrderNumber}</span>
                  <span class={wo.statusBadgeClass}>{wo.status}</span>
                </div>
                <p class="wo-subject">{wo.subject}</p>
                <div class="wo-date">{wo.dateRange}</div>
              </div>
            </template>
          </div>
        </template>

        <template lwc:else>
          <div class="empty-message">No recent service visits</div>
        </template>
      </div>
    </div>
  </div>
</template>
